[package]
name = "asmov-copywriter-lib-model"
metadata.era = "1"
version = "0.1.0"
edition = "2024"
description = "Model library for Asmov Copywriter"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/copywriter"
homepage = "https://asmov.software"
categories = []
keywords = ["asmov", "copywriter"]

[dependencies]
asmov-copywriter-lib = { version = "0.1", path = "../copywriter-lib" }
garde = { version = "0.22", features = ["full"] }
serde = { version = "1", features = ["derive"] }
