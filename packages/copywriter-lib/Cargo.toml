[package]
name = "asmov-copywriter-lib"
version = "0.1.0"
edition = "2024"
description = "Library for Asmov Copywriter"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/copywriter"
homepage = "https://asmov.software"
categories = []
keywords = ["asmov", "copywriter"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
garde = "0.22"
handlebars = { version = "6", features = ["walkdir", "dir_source"] }
pulldown-cmark = { version = "0.13", features = ["serde"] }
pulldown-cmark-toc = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
asmov-common-testing = "2"
asmov-copywriter-lib-model = { path = "../copywriter-lib-model" }
slugify = "0.1"
