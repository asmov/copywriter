[package]
name = "asmov-copywriter"
version = "0.1.0"
edition = "2024"
description = "Website builder using Markdown and Handlebars"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/copywriter"
homepage = "https://asmov.software"
categories = ["development-tools"]
keywords = ["website", "builder", "building"]

[[bin]]
name = "copywriter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
asmov-copywriter-lib = { version = "0.1.0", path = "../copywriter-lib" }
clap = { version = "4.5.36", features = ["derive"] }
handlebars = { version = "6.3.2", features = ["walkdir", "dir_source"] }
pulldown-cmark = { version = "0.13.0", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.20"
