[package]
name = "asmov-copywriter"
version = "0.1.0"
metadata.era = "1"
description = "Website builder using Markdown and Handlebars"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/copywriter"
homepage = "https://asmov.software"
categories = ["development-tools"]
keywords = ["site", "website", "builder", "blog"]
edition = "2024"

[[bin]]
name = "copywriter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
asmov-copywriter-lib = { version = "0.1", path = "../copywriter-lib" }
asmov-copywriter-lib-model = { version = "0.1", path = "../copywriter-lib-model" }

[dev-dependencies]
asmov-common-testing = "2"
